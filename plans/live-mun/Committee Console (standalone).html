  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

12px 4px;border-bottom:1px solid var(--bd)\">\n                  <span style=\"flex:1;font-size:13.5px;font-weight:500\">{{ h.label }}<\u002Fspan>\n                  <span style=\"width:38px;height:22px;border-radius:999px;background:var(--pri);position:relative;flex:none\"><span style=\"position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:#0f1012\"><\u002Fspan><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  \n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;scenario&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;speaking&quot;,&quot;idle&quot;],&quot;default&quot;:&quot;speaking&quot;,&quot;tsType&quot;:&quot;'speaking' | 'idle'&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;startMuted&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;startCamOff&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Session&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const speaking = (this.props.scenario ?? \"speaking\") !== \"idle\";\n    this.speakers = [\n      { code: \"fr\", country: \"France\", org: \"Work\" },\n      { code: \"cn\", country: \"China\", org: \"Dhaka Office Work\" },\n      { code: \"gb\", country: \"United Kingdom\", org: \"Akhand Foundation\" },\n    ];\n    this.delegates = [\n      { code: \"cn\", country: \"China\", org: \"Dhaka Office Work\" },\n      { code: \"fr\", country: \"France\", org: \"Work\" },\n      { code: \"gb\", country: \"United Kingdom\", org: \"Akhand Foundation\" },\n      { code: \"gb\", country: \"United Kingdom\", org: \"Rasel Ashraf\" },\n      { code: \"kr\", country: \"South Korea\", org: \"Akhand Digital Dhaka\" },\n      { code: \"mt\", country: \"Malta\", org: \"Delegate\" },\n      { code: \"us\", country: \"United States\", org: \"Shuriken IT\" },\n    ];\n    this.state = {\n      now: Date.now(),\n      micOn: !(this.props.startMuted ?? true),\n      camOn: !(this.props.startCamOff ?? true),\n      handUp: false,\n      captionsOn: false,\n      panel: null,          // null | 'tools' | 'chat' | 'host'\n      tool: null,           // null | rollcall | voting | speakers | caucus | points | marking | report\n      floorActive: speaking,\n      activeIdx: 0,\n      timer: { running: speaking, durationMs: 90000, endsAt: Date.now() + 83000, paused: 83000 },\n    };\n  }\n  componentDidMount() {\n    this._iv = setInterval(() => this.setState({ now: Date.now() }), 400);\n  }\n  componentWillUnmount() { clearInterval(this._iv); }\n\n  remaining() {\n    const t = this.state.timer;\n    return t.running ? Math.max(0, t.endsAt - this.state.now) : t.paused;\n  }\n  fmt(ms) {\n    const s = Math.ceil(ms / 1000);\n    return Math.floor(s / 60) + \":\" + String(s % 60).padStart(2, \"0\");\n  }\n  clockStr() {\n    const d = new Date(this.state.now);\n    return String(d.getHours()).padStart(2, \"0\") + \":\" + String(d.getMinutes()).padStart(2, \"0\");\n  }\n\n  renderVals() {\n    const s = this.state;\n    const active = s.floorActive ? this.speakers[s.activeIdx] : null;\n    const rem = this.remaining();\n    const t = s.timer;\n    const pct = t.durationMs > 0 ? Math.max(0, (rem / t.durationMs) * 100) : 0;\n    const danger = t.running && rem < 10000;\n\n    const setTimer = (patch) => this.setState({ timer: { ...this.state.timer, ...patch } });\n    const startPause = () => { const r = this.remaining(); if (t.running) setTimer({ running: false, paused: r }); else setTimer({ running: true, endsAt: Date.now() + (r > 0 ? r : t.durationMs) }); };\n    const adjust = (d) => { const r = Math.max(0, this.remaining() + d); if (t.running) setTimer({ endsAt: Date.now() + r }); else setTimer({ paused: r }); };\n    const next = () => {\n      if (s.activeIdx + 1 < this.speakers.length) this.setState({ activeIdx: s.activeIdx + 1, timer: { ...t, running: true, durationMs: 90000, endsAt: Date.now() + 90000, paused: 90000 } });\n      else this.setState({ floorActive: false, timer: { ...t, running: false, paused: 0 } });\n    };\n\n    const openTool = (id) => this.setState({ panel: \"tools\", tool: id });\n    const meta = {\n      rollcall: { icon: \"checklist\", title: \"Roll Call\", sub: \"Establish quorum\", live: false },\n      voting: { icon: \"how_to_vote\", title: \"Voting\", sub: \"Motions & resolutions\", live: false },\n      speakers: { icon: \"mic\", title: \"Speakers List\", sub: \"General Speakers List\", live: s.floorActive },\n      caucus: { icon: \"groups\", title: \"Caucus\", sub: \"Moderated & unmoderated\", live: false },\n      points: { icon: \"front_hand\", title: \"Points & Motions\", sub: \"Live raises & motion log\", live: false, badge: \"1\" },\n      marking: { icon: \"assignment\", title: \"Marking\", sub: \"Daily rubric scoring\", live: false },\n      report: { icon: \"description\", title: \"Report\", sub: \"Participation summary\", live: false },\n    };\n    const order = [\"rollcall\", \"voting\", \"speakers\", \"caucus\", \"points\", \"marking\", \"report\"];\n    const tools = order.map((id) => ({ ...meta[id], id, open: () => openTool(id), badge: id === \"points\" ? \"1\" : null }));\n    const tm = s.tool ? meta[s.tool] : null;\n\n    return {\n      clock: this.clockStr(),\n      // video controls\n      micOn: s.micOn, camOn: s.camOn,\n      micIcon: s.micOn ? \"mic\" : \"mic_off\", camIcon: s.camOn ? \"videocam\" : \"videocam_off\",\n      micBtnBg: s.micOn ? \"#2a2c31\" : \"var(--rd)\", micBtnFg: s.micOn ? \"#e6e8eb\" : \"#fff\",\n      camBtnBg: s.camOn ? \"#2a2c31\" : \"var(--rd)\", camBtnFg: s.camOn ? \"#e6e8eb\" : \"#fff\",\n      capBtnBg: s.captionsOn ? \"var(--pri)\" : \"#2a2c31\", capBtnFg: s.captionsOn ? \"#0f1012\" : \"#e6e8eb\",\n      handBtnBg: s.handUp ? \"var(--am)\" : \"#2a2c31\", handBtnFg: s.handUp ? \"#0f1012\" : \"#e6e8eb\",\n      toggleMic: () => this.setState({ micOn: !s.micOn }),\n      toggleCam: () => this.setState({ camOn: !s.camOn }),\n      toggleCaptions: () => this.setState({ captionsOn: !s.captionsOn }),\n      toggleHand: () => this.setState({ handUp: !s.handUp }),\n      // stage\n      hasFloor: s.floorActive, noFloor: !s.floorActive,\n      spkCode: active ? active.code : \"un\", spkCountry: active ? active.country : \"\", spkOrg: active ? active.org : \"\",\n      timerText: this.fmt(rem), timerPct: pct,\n      // live strip\n      liveDot: s.floorActive ? \"var(--em)\" : \"#6b7075\",\n      liveLabel: s.floorActive ? (\"Speaking · \" + active.country) : \"Floor open — add speakers\",\n      liveTimer: s.floorActive ? this.fmt(rem) : \"0:00\",\n      nextLabel: s.floorActive ? \"Next\" : \"Start\",\n      onNext: next,\n      danger,\n      // launchers\n      openTools: () => this.setState({ panel: s.panel === \"tools\" ? null : \"tools\", tool: null }),\n      openChat: () => this.setState({ panel: s.panel === \"chat\" ? null : \"chat\", tool: null }),\n      openHost: () => this.setState({ panel: s.panel === \"host\" ? null : \"host\", tool: null }),\n      closePanel: () => this.setState({ panel: null, tool: null }),\n      back: () => this.setState({ tool: null }),\n      openProjector: () => {},\n      hasPending: true, pendingCount: \"1\",\n      toolsBtnBg: s.panel === \"tools\" ? \"var(--pri)\" : \"rgba(255,255,255,.12)\",\n      toolsBtnFg: s.panel === \"tools\" ? \"#0f1012\" : \"#e6e8eb\",\n      // panel routing\n      panelOpen: s.panel != null,\n      atToolsList: s.panel === \"tools\" && !s.tool,\n      atTool: s.panel === \"tools\" && !!s.tool,\n      showChat: s.panel === \"chat\",\n      showHost: s.panel === \"host\",\n      showRollcall: s.tool === \"rollcall\", showVoting: s.tool === \"voting\", showSpeakers: s.tool === \"speakers\",\n      showCaucus: s.tool === \"caucus\", showPoints: s.tool === \"points\", showMarking: s.tool === \"marking\", showReport: s.tool === \"report\",\n      toolIcon: tm ? tm.icon : \"apps\", toolTitle: tm ? tm.title : \"\", toolSub: tm ? tm.sub : \"\",\n      tools,\n      // data\n      delegates: this.delegates,\n      report: [\n        { code: \"cn\", country: \"China\", org: \"Dhaka Office Work\", time: \"0:00\" },\n        { code: \"fr\", country: \"France\", org: \"Work\", time: \"0:07\" },\n        { code: \"gb\", country: \"United Kingdom\", org: \"Akhand Foundation\", time: \"0:00\" },\n        { code: \"gb\", country: \"United Kingdom\", org: \"Rasel Ashraf\", time: \"0:00\" },\n        { code: \"kr\", country: \"South Korea\", org: \"Akhand Digital Dhaka\", time: \"0:00\" },\n        { code: \"mt\", country: \"Malta\", org: \"Delegate\", time: \"0:00\" },\n        { code: \"us\", country: \"United States\", org: \"Shuriken IT\", time: \"0:00\" },\n      ],\n      marking: this.delegates.map((d, i) => ({ ...d, score: \"\", pct: \"—\", speeches: \"1\", time: d.country === \"France\" ? \"0:07\" : \"0:00\" })),\n      hostToggles: [\n        { label: \"Host management\" },\n        { label: \"Let delegates share screen\" },\n        { label: \"Let delegates send reactions\" },\n        { label: \"Turn on their microphone\" },\n        { label: \"Turn on their video\" },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
