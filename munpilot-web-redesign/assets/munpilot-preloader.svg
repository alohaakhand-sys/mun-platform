<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -130 492 160" width="246" height="80" role="img" aria-label="Loading MUN Pilot">
  <style>
    .mp-mun{fill:#0E1D2C;animation:mp-breathe 1.6s ease-in-out infinite}
    .mp-pilot{fill:#0B6E4F;animation:mp-breathe 1.6s ease-in-out .2s infinite}
    .mp-dot{fill:#0E1D2C;transform-box:fill-box;transform-origin:center;animation:mp-hop 1.6s cubic-bezier(.45,0,.25,1) infinite}
    .mp-shadow{fill:#0E1D2C;opacity:.12;transform-box:fill-box;transform-origin:center;animation:mp-shadow 1.6s cubic-bezier(.45,0,.25,1) infinite}
    @keyframes mp-breathe{0%,100%{opacity:1}50%{opacity:.45}}
    @keyframes mp-hop{0%,100%{transform:translateY(0) rotate(0)}12%{transform:translateY(2px) scale(1.08,.9)}50%{transform:translateY(-26px) rotate(180deg)}88%{transform:translateY(0) rotate(360deg)}}
    @keyframes mp-shadow{0%,100%,88%{transform:scaleX(1);opacity:.14}50%{transform:scaleX(.45);opacity:.05}}
    @media (prefers-color-scheme:dark){.mp-mun,.mp-dot,.mp-shadow{fill:#EDF2F5}.mp-pilot{fill:#47A481}}
    @media (prefers-reduced-motion:reduce){.mp-mun,.mp-pilot,.mp-dot,.mp-shadow{animation:none}}
  </style>
